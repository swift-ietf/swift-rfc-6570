# SwiftLint configuration for swift-rfc-6570
# Inherits from the shared parent configuration in swift-standards

parent_config: https://raw.githubusercontent.com/swift-standards/.github/main/.swiftlint.yml

# Package-specific overrides
disabled_rules:
  - empty_string
  - implicit_optional_initialization
  - opening_brace
  # force_try: deliberate, not accidental. RFC_6570.Variable's two dictionary
  # constructors build `[String: String].Ordered` from (a) a native Swift
  # Dictionary's sorted key-value pairs, whose keys are already unique by
  # construction, and (b) the fixed variadic element list a caller writes in a
  # dictionary-literal expression — both call sites are internal to this type's
  # own literal/conversion initializers, consistently, not an omitted error path.
  # iso-8601 precedent.
  - force_try
